<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест группировки экзаменов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a202c;
            color: #f7fafc;
            padding: 20px;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .group {
            background: #2d3748;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            border-left: 4px solid #9f7aea;
        }
        
        .group-header {
            background: linear-gradient(135deg, #9f7aea 0%, #805ad5 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .group-indicator {
            transition: transform 0.3s ease;
        }
        
        .group-indicator.expanded {
            transform: rotate(180deg);
        }
        
        .exam-list {
            display: none;
        }
        
        .exam-list.expanded {
            display: block;
        }
        
        .exam-item {
            background: #4a5568;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        
        .exam-item.nearest {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            font-weight: 600;
        }
        
        .single-exam {
            background: #2d3748;
            padding: 12px;
            border-radius: 6px;
            margin: 8px 0;
        }
        
        .status {
            color: #68d391;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Тест ИСПРАВЛЕННОЙ группировки экзаменов</h1>
        <p>Проверка логики группировки по префиксу (до подчеркивания) с принципом "колоды карт"</p>
        <div style="background: #2d3748; padding: 12px; border-radius: 6px; margin: 16px 0;">
            <strong>🔧 Исправление:</strong> Теперь группировка работает по префиксу до подчеркивания:<br>
            ОТ_б, ОТ_пмп, ОТ_рпо, ОТ_сиз → группа "ОТ"<br>
            ПБ_общ, ПБ_газ → группа "ПБ"
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        // Тестовые данные
        const testExams = [
            { exam_id: '1', exam_name: 'ОТ_б', next_exam_date: '2025-02-01' },
            { exam_id: '2', exam_name: 'ОТ_пмп', next_exam_date: '2025-02-02' },
            { exam_id: '3', exam_name: 'ОТ_рпо', next_exam_date: '2026-03-02' },
            { exam_id: '4', exam_name: 'ОТ_сиз', next_exam_date: '2027-04-02' },
            { exam_id: '5', exam_name: 'ПБ_общ', next_exam_date: '2025-03-01' },
            { exam_id: '6', exam_name: 'ПБ_газ', next_exam_date: '2025-03-15' },
            { exam_id: '7', exam_name: 'ЭБ_до', next_exam_date: '2025-01-15' },
            { exam_id: '8', exam_name: 'МД_осм', next_exam_date: '2025-04-01' }
        ];

        // Функция группировки
        function groupExams(exams) {
            const allExams = new Map();
            
            exams.forEach(exam => {
                if (!allExams.has(exam.exam_id)) {
                    allExams.set(exam.exam_id, exam);
                }
            });
            
            const groupMap = new Map();
            
            Array.from(allExams.values()).forEach(exam => {
                const examName = exam.exam_name.toUpperCase();
                // Берем все символы до первого подчеркивания
                const underscoreIndex = examName.indexOf('_');
                const prefix = underscoreIndex !== -1 ? examName.substring(0, underscoreIndex) : examName;
                
                if (!groupMap.has(prefix)) {
                    groupMap.set(prefix, {
                        key: prefix,
                        name: prefix,
                        exams: []
                    });
                }
                
                groupMap.get(prefix).exams.push(exam);
            });
            
            const filteredGroups = Array.from(groupMap.values()).filter(group => group.exams.length > 1);
            
            filteredGroups.forEach(group => {
                group.exams.sort((a, b) => {
                    const aDate = a.next_exam_date ? new Date(a.next_exam_date).getTime() : Infinity;
                    const bDate = b.next_exam_date ? new Date(b.next_exam_date).getTime() : Infinity;
                    return aDate - bDate;
                });
                
                group.nearestExam = group.exams[0];
            });
            
            const groupedExamIds = new Set();
            filteredGroups.forEach(group => {
                group.exams.forEach(exam => groupedExamIds.add(exam.exam_id));
            });
            
            const singleExams = Array.from(allExams.values())
                .filter(exam => !groupedExamIds.has(exam.exam_id))
                .map(exam => ({
                    key: exam.exam_id,
                    name: exam.exam_name,
                    exams: [exam],
                    nearestExam: exam
                }));
            
            return [...filteredGroups, ...singleExams].sort((a, b) => {
                return a.name.localeCompare(b.name);
            });
        }

        // Отображение результатов
        function displayResults() {
            const groups = groupExams(testExams);
            const resultsDiv = document.getElementById('results');
            
            let html = '<h2>📊 Результаты группировки:</h2>';
            
            groups.forEach(group => {
                if (group.exams.length > 1) {
                    html += `
                        <div class="group">
                            <div class="group-header" onclick="toggleGroup('${group.key}')">
                                <span>🎴 Группа "${group.name}" (${group.exams.length} экзаменов)</span>
                                <span class="group-indicator" id="indicator-${group.key}">▼</span>
                            </div>
                            <div class="exam-list" id="list-${group.key}">
                                <p><strong>Показывается:</strong> ${group.nearestExam.exam_name} - ${formatDate(group.nearestExam.next_exam_date)}</p>
                                <p><strong>Полный список (сортировка по дате):</strong></p>
                    `;
                    
                    group.exams.forEach((exam, index) => {
                        const isNearest = index === 0;
                        html += `
                            <div class="exam-item ${isNearest ? 'nearest' : ''}">
                                <span>${exam.exam_name}</span>
                                <span>${formatDate(exam.next_exam_date)} ${isNearest ? '👆 (на верху колоды)' : ''}</span>
                            </div>
                        `;
                    });
                    
                    html += '</div></div>';
                } else {
                    html += `
                        <div class="single-exam">
                            📄 <strong>${group.name}</strong> - ${formatDate(group.exams[0].next_exam_date)} 
                            <span class="status">(одиночный экзамен)</span>
                        </div>
                    `;
                }
            });
            
            resultsDiv.innerHTML = html;
        }

        function toggleGroup(groupKey) {
            const list = document.getElementById(`list-${groupKey}`);
            const indicator = document.getElementById(`indicator-${groupKey}`);
            
            list.classList.toggle('expanded');
            indicator.classList.toggle('expanded');
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('ru-RU');
        }

        // Запуск теста
        displayResults();
    </script>
</body>
</html>
